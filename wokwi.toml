[wokwi]
version = 1

# Wokwi simulează un singur firmware pe placa „slave".
# Pentru testare fizică dual-MCU se rulează `pio run -e esp32_master`
# respectiv `pio run -e esp32_slave` și se încarcă pe plăci separate.
firmware = '.pio/build/esp32_slave/firmware.bin'
elf      = '.pio/build/esp32_slave/firmware.elf'
