; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Implicit se compilează toate target-urile
default_envs = esp32_master, esp32_slave, esp32_demo

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -I include
    -Wall

[env:esp32_master]
; Build pentru placa fizică MASTER (cablu USB dedicat)
build_src_filter = +<main_master.cpp>

[env:esp32_slave]
; Build pentru placa fizică SLAVE (cablu USB dedicat)
build_src_filter = +<main_slave.cpp>

[env:esp32_demo]
; Build de DEMO pentru simulare Wokwi: master + slave pe același chip, unite
; prin jumperi între Wire (I2C0) și Wire1 (I2C1).
build_src_filter = +<main_demo.cpp>
