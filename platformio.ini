; ============================================================================
;  LAB 7.3 — MQTT IoT Node (ESP32 + DHT22 + LED + FreeRTOS)
; ============================================================================
;  Un singur environment: `esp32dev` — atât pentru simulare (Wokwi), cât și
;  pentru flash pe placa fizică. Credentialele Wi-Fi / brokerul se schimbă
;  în `include/configs.h`.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32
framework     = arduino
board         = esp32dev
monitor_speed = 115200
lib_ldf_mode  = chain+
build_flags   =
    -I include
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
