; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Implicit se compilează ambele target-uri (master + slave)
default_envs = esp32_master, esp32_slave

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -I include
    -Wall

[env:esp32_master]
; ESP32 care interoghează slave-ul și afișează distanțele pe Serial
build_src_filter = +<main_master.cpp>

[env:esp32_slave]
; ESP32 care colectează distanțele de la HC-SR04 și răspunde pe I2C
build_src_filter = +<main_slave.cpp>
