; ============================================================================
;  LAB 7.2 — Comunicații prin protocol logic binar pe UART (ESP32 + FreeRTOS)
; ============================================================================
;
;  Trei medii de build:
;   - esp32_master: firmware pentru placa Master (flash pe hardware fizic #1)
;   - esp32_slave : firmware pentru placa Slave  (flash pe hardware fizic #2)
;   - esp32_demo  : build unic pentru Wokwi (single-chip, UART virtual)
;
;  `build_src_filter` alege care `src/main_*.cpp` intră în fiecare env.

[platformio]
default_envs = esp32_master, esp32_slave, esp32_demo

[env]
platform      = espressif32
framework     = arduino
board         = esp32dev
monitor_speed = 115200
lib_ldf_mode  = chain+
build_flags   =
    -I include
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

[env:esp32_master]
build_src_filter = +<main_master.cpp>

[env:esp32_slave]
build_src_filter = +<main_slave.cpp>

[env:esp32_demo]
build_src_filter = +<main_demo.cpp>
